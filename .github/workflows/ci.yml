name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shift-report-tests:
    name: Shift report unit tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shift-report/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -q

  repository-checks:
    name: Repository checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JSON, Python and Markdown link checks
        run: python tools/validate_repo.py
      - name: PowerShell syntax check
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count) { $bad++; "$($_.FullName): $($errors[0].Message)" }
          }
          if ($bad) { throw "$bad PowerShell file(s) with syntax errors" }
      - name: Maintenance guard offline tests
        shell: powershell
        working-directory: lab-kit/management/guard
        run: .\test-maintenance-guard.ps1
